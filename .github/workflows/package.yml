name: Package verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-gate:
    name: Production-only package gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify package boundary and licenses
        shell: pwsh
        run: ./Tools~/Verify-Package.ps1
      - name: Build allowlisted release archive
        shell: pwsh
        run: ./Tools~/New-ReleaseArchive.ps1 -PackageRoot $PWD -DestinationPath (Join-Path $env:RUNNER_TEMP 'com.kitchenlib.studio-0.1.0.zip')
      - name: Upload verified release archive
        uses: actions/upload-artifact@v4
        with:
          name: com.kitchenlib.studio-0.1.0
          path: ${{ runner.temp }}/com.kitchenlib.studio-0.1.0.zip
          if-no-files-found: error

  unity-import:
    name: Unity 2020.3 clean import
    if: ${{ vars.KITCHENLIB_STUDIO_UNITY_IMPORT == 'enabled' }}
    runs-on: [self-hosted, unity-2020.3]
    steps:
      - uses: actions/checkout@v4
      - name: Verify clean local-package import
        shell: pwsh
        env:
          UNITY_PATH: ${{ vars.UNITY_2020_3_PATH }}
        run: ./Tools~/Verify-CleanUnityImport.ps1 -PackageRoot $PWD
